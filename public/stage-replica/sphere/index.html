<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <title>Stage Replica · Sphere / Immersive Dome</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070a; color: #f4f6f8; }
      canvas { display: block; }
      .hud { position: fixed; z-index: 10; bottom: max(16px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); width: min(360px, calc(100vw - 32px)); padding: 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(6,8,12,.78); backdrop-filter: blur(18px); box-shadow: 0 18px 50px rgba(0,0,0,.28); }
      .hud h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .04em; }
      .hud .sub { font-size: 11px; color: #8d97a3; margin-bottom: 10px; }
      .meta { display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; font-size: 11.5px; color: #a9b0ba; }
      .meta strong { color: #eef1f4; font-weight: 600; overflow-wrap: anywhere; }
      .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      button { flex: 1 1 auto; min-height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); color: #f4f6f8; padding: 6px 9px; font: inherit; font-size: 11px; cursor: pointer; }
      button:hover { background: rgba(255,255,255,.13); }
      button[aria-pressed="true"] { background: #f3f5f7; color: #07090d; border-color: transparent; font-weight: 650; }
      .badge { position: fixed; z-index: 10; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); max-width: 360px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(6,8,12,.78); backdrop-filter: blur(14px); font-size: 11px; line-height: 1.5; color: #f0c98a; text-align: right; }
      .badge span { color: #8d97a3; }
      .quad { position: fixed; z-index: 9; pointer-events: none; }
      .quad-label { position: absolute; font: 650 10px/1 ui-monospace, monospace; color: #e8edf3; text-shadow: 0 1px 3px #000; letter-spacing: .04em; }
      .quad-frame { position: absolute; border: 1px solid rgba(255,255,255,.28); }
      .quad-frame[data-program="true"] { border-color: #7cc4ff; }
      .stream[data-state="fallback"], .stream[data-state="offline"] { color: #f0c98a; }
      .stream[data-state="live"] { color: #9ee6a8; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="hud">
      <h1>STAGE REPLICA · SPHERE / IMMERSIVE DOME</h1>
      <div class="sub">Issue #81 · P0 · Reference → Graybox → V1</div>
      <div class="meta">
        <span>STATE</span><strong id="hud-state">—</strong>
        <span>CUE</span><strong id="hud-cue">—</strong>
        <span>STREAM</span><strong class="stream" id="hud-stream">—</strong>
        <span>ADAPT</span><strong id="hud-mode">—</strong>
        <span>PROGRAM</span><strong id="hud-cam">—</strong>
        <span>FIT</span><strong id="hud-fit">—</strong>
      </div>
      <div class="row" id="row-cam"></div>
      <div class="row" id="row-mode"></div>
      <div class="row">
        <button type="button" id="btn-cue">暂停 CUE</button>
        <button type="button" id="btn-drop">模拟源中断</button>
      </div>
    </div>
    <div class="badge">
      <b>教学预演 PROXY</b><br />
      dome r=25m · 观众地面 ⌀34m · 舞台 14×8m<br />
      母版规格 4096² / 2048²（V1 运行时源 1280×720）<br />
      <span>非 Sphere 真实场馆尺寸 / 非 16K 母版规格</span><br />
      <a href="https://github.com/ewanqian/portfolio/blob/codex/stage-replica-sphere-20261015/lab/stage-replica/sphere/reference/reference.md" target="_blank" rel="noreferrer">参考来源与 confirmed / proxy 对照 ↗</a>
    </div>
    <div class="quad" id="quad"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
