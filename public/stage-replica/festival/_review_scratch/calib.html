<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";

const H = innerHeight, W = innerWidth;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1); renderer.setSize(W,H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
// flat emissive planes so pixel extents are unambiguous
function plane(x,y,z,w,h,rotY,color){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide}));
  m.position.set(x,y,z); m.rotation.y = rotY*Math.PI/180; scene.add(m); return m;
}
// exactly the scene.json geometry
plane(-13,4.5,-10,18,9, 18, 0xff0000);   // SCREEN_L red
plane( 13,4.5,-10,18,9,-18, 0x00ff00);   // SCREEN_R green
// scale probes: 1m cube at origin, 5m bar at z=8, 1.7m post at origin
plane(0,0.5,0,1,1,0,0x0000ff);
plane(0,0.03,8,5,0.05,0,0xffffff);
const cam = new THREE.PerspectiveCamera(58, W/H, 0.05, 500);
cam.position.set(0,6.5,30); cam.lookAt(new THREE.Vector3(0,5,-9));
renderer.render(scene, cam);
window.__probe = {W,H,cam:{fov:cam.fov,aspect:cam.aspect,pos:cam.position.toArray()},
  project:(x,y,z)=>{const v=new THREE.Vector3(x,y,z).project(cam); return [(v.x+1)*0.5*W,(1-v.y)*0.5*H];}};
window.__probe.corners = {
  Lbl: window.__probe.project(-13-9*Math.cos(Math.PI/10)*Math.cos(0),0,0)
};
// exact corner projection for each wall local (+-9, +-4.5)
function corner(sx, cx, cz, rotDeg, lx, ly){
  const r = rotDeg*Math.PI/180;
  const wx = cx + Math.cos(r)*lx;
  const wz = cz - Math.sin(r)*lx;
  return window.__probe.project(wx, 4.5+ly, wz);
}
window.__probe.L = {out_bot:corner(0,-13,-10,18,-9,-4.5), in_bot:corner(0,-13,-10,18,9,-4.5),
                    out_top:corner(0,-13,-10,18,-9,4.5), in_top:corner(0,-13,-10,18,9,4.5)};
window.__probe.R = {out_bot:corner(0,13,-10,-18,9,-4.5), in_bot:corner(0,13,-10,-18,-9,-4.5),
                    out_top:corner(0,13,-10,-18,9,4.5), in_top:corner(0,13,-10,-18,-9,4.5)};
window.__probe.done = true;
</script></body></html>
