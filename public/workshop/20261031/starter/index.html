<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的第一座数字舞台</title><link rel="stylesheet" href="style.css"><style>body{display:grid;grid-template-columns:320px 1fr;height:100vh}aside{padding:22px;overflow:auto;background:#161e19}#view{position:relative;min-width:0;overflow:hidden}canvas{display:block;width:100%;height:100%}h1{font-size:28px}nav{gap:7px}button,select{padding:7px 10px}#hud{position:absolute;left:20px;top:20px;padding:10px;background:#101416cc;pointer-events:none}#error{position:absolute;bottom:20px;left:20px;color:#ffd699;max-width:80%}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){body{display:flex;height:auto;flex-direction:column}#view{height:65vh;order:-1}}</style><aside><a href="../web/">← 备课台</a><h1>舞台灰盒</h1><p class="muted">教学假设尺寸。默认图案离线可用。人物约 1.7m。</p><nav><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="far">远景</button></nav><div class="row"><button id="play">暂停</button><button id="restart">重播</button><button id="pattern">内置图案</button></div><label>时间 <output id="time">0.0s</output><input id="seek" type="range" min="0" max="29.99" step="0.1" value="0"></label><label>Cue<select id="cue"><option value="0">1 开场 / 0–10s</option><option value="1">2 展开 / 10–20s</option><option value="2">3 收束 / 20–30s</option></select></label><label>主屏宽度 <output id="widthValue"></output><input id="width" type="range" min="4" max="12" step="0.1" value="8"></label><label>顶屏倾角 <output id="tiltValue"></output><input id="tilt" type="range" min="0" max="90" step="1" value="45"></label><label>人物横向位置 <output id="personValue"></output><input id="person" type="range" min="-4" max="4" step="0.1" value="0"></label><label>导入本地视频<input id="videoFile" type="file" accept="video/*"></label><label>画面适配<select id="fit"><option value="contain">完整显示 contain</option><option value="cover">填满裁切 cover</option></select></label><small id="mediaName">当前：原创测试图案</small><nav><button id="v1">存 V1</button><button id="v2">存 V2</button><button id="load1">看 V1</button><button id="load2">看 V2</button><button id="export">导出参数</button><button id="shot">保存截图</button></nav><label>导入参数 JSON<input id="import" type="file" accept="application/json"></label><p id="status" role="status">拖动画面旋转；滚轮拉近或拉远。</p><small>保存参数不包含视频。迁移工程需一起复制原始素材，重新选文件。无真实照度、雾效或 DMX 模拟。</small></aside><div id="view"><div id="hud">STAGE REPLICA / GRAYBOX<br><span id="viewName">正面</span> · <span id="cueName">开场</span></div><p id="error" role="alert"></p></div><script type="module" src="scene.js"></script></html>
