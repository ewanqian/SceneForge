<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC · 同页媒体回环</title><link rel="stylesheet" href="../style.css"><header><a href="../">← 备课台</a><h1>一帧画面<br>如何到达另一端？</h1><p>同页两个 RTCPeerConnection。真实媒体回环；不代表跨设备网络已打通。</p><nav><button id="start" class="primary">开始图案回环</button><button id="camera">摄像头回环</button><button id="stop">停止并释放</button></nav><p id="status" role="status">等待开始。图案回环无需摄像头权限。</p></header><main><div class="grid"><section><h2>发送端：本地媒体</h2><canvas id="source" width="640" height="360" style="width:100%"></canvas><video id="local" muted playsinline style="width:100%;display:none"></video></section><section><h2>接收端：远端轨道</h2><video id="remote" autoplay muted playsinline controls style="width:100%;background:black;aspect-ratio:16/9"></video></section></div><h2>连接过程</h2><pre id="log" style="white-space:pre-wrap"></pre><p>采集媒体后加入轨道，再交换 offer、answer 与 ICE 候选。此处信令通过内存传递，未配置 STUN / TURN。跨设备使用时，还需信令服务、网络连通与安全页面。</p><a href="https://webrtc.org/getting-started/peer-connections" target="_blank" rel="noopener">WebRTC 官方说明 ↗</a></main><script src="webrtc.js"></script></html>
