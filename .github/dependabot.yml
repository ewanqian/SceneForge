version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns:
          - "three"
          - "@react-three/*"
      toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "vitest"
          - "@biomejs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
